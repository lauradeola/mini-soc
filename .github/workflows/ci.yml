name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do backend
        working-directory: backend
        run: |
          npm install
          npm test
      - name: Testes do coletor
        run: node --test collector/*.test.js

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do servidor
        working-directory: backend
        run: npm install
      - name: Dependências do teste de navegador
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta
        working-directory: e2e
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: e2e/test-results
